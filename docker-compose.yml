version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: cloudblitz-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - cloudblitz-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudblitz-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/cloudblitz
      - JWT_SECRET=cloudblitz_super_secret_jwt_key_2026
      - CLIENT_URL=http://localhost:80
    depends_on:
      - mongodb
    networks:
      - cloudblitz-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudblitz-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - cloudblitz-network

volumes:
  mongo_data:

networks:
  cloudblitz-network:
    driver: bridge
